packages:
  - "packages/*"
  - "integrations/*"

# pnpm settings live here (pnpm 11 reads only registry and auth settings from .npmrc).
# Refuse to install or run with a Node version outside every package's `engines` field.
engineStrict: true

# langsmith (pulled in by langchain and @langchain/core) is held at one version, 0.11.5: @langchain/core 1.2.18 and
# later need >=0.11.0, and the declarations of 0.10.10 and 0.10.11 lacked NullableHeaders and failed a strict
# (skipLibCheck: false) type check of the LangChain integrations; 0.11.5 passes it.
# axios (pinned at 1.19.0 by @openfga/sdk in the private policy-composition example) is lifted to 1.20.0 to clear
# its advisories (founder, 2026-10-13); the OpenFGA tests pass on it.
overrides:
  langsmith: 0.11.5
  axios: 1.20.0
